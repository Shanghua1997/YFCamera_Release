plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yf.camera'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yf.camera'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'

        // 高德 Key 由最终 App 持有，locationlib 不硬编码 Key。
        manifestPlaceholders = [AMAP_KEY: 'f2cc843e0886d30df3704c817726892f']
    }
}

dependencies {
    // Y 作为最终 App：直接依赖权限库 P。
    implementation files('libs/permissionlib-release.aar')

    // Y 依赖 L 的源码模块；Y 不再直接声明高德依赖。
    implementation project(':locationlib')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.camera:camera-video:1.4.2'
    implementation 'androidx.camera:camera-effects:1.4.2'
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'

    // P 是 Kotlin 写的，Y 的 Java 代码也直接使用 kotlin.Unit。
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
}
